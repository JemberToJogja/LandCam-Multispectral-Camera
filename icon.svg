<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
<defs>
<!-- Background Gradient -->
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#A1A8AF"/>
<stop offset="100%" stop-color="#7B828A"/>
</linearGradient>
​<!-- Outer Ring Gradient -->
<linearGradient id="outerRingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#696F77"/>
<stop offset="100%" stop-color="#43474D"/>
</linearGradient>
​<!-- Inner Ring Shadow / Highlight -->
<linearGradient id="innerRingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#383C41"/>
<stop offset="100%" stop-color="#23262A"/>
</linearGradient>
​<!-- Green Center Gradient -->
<linearGradient id="greenCenterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#20E052"/>
<stop offset="50%" stop-color="#14B83E"/>
<stop offset="100%" stop-color="#0E8A2E"/>
</linearGradient>
​<!-- Screw Color -->
<linearGradient id="screwGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#8C929A"/>
<stop offset="100%" stop-color="#555960"/>
</linearGradient>
​<!-- Soft Drop Shadow for Icon Background -->
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
<feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.18"/>
</filter>
​<!-- Soft Shadow for Bezel -->
<filter id="bezelShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
</filter>
​<!-- Inner Lens Cutout Soft Inset Simulation -->
<linearGradient id="lensMaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#0B521B"/>
<stop offset="100%" stop-color="#128A2F"/>
</linearGradient>
</defs>
​<!-- iOS Squircle Base Container -->
<rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#shadow)"/>
​<!-- Main Camera Bezel Group -->
<g filter="url(#bezelShadow)">
<!-- Outer Metallic Ring -->
<circle cx="256" cy="256" r="176" fill="url(#outerRingGrad)"/>
<circle cx="256" cy="256" r="172" fill="none" stroke="#B8BEC6" stroke-width="2" opacity="0.4"/>
​<!-- Inner Metallic Ring -->
<circle cx="256" cy="256" r="140" fill="url(#innerRingGrad)"/>
​<!-- Green Center Plate -->
<circle cx="256" cy="256" r="128" fill="url(#greenCenterGrad)"/>
​<!-- Screws Around Bezel -->
<!-- Top -->
<polygon points="256,92 261,95 261,101 256,104 251,101 251,95" fill="url(#screwGrad)"/>
<!-- Top Right -->
<polygon points="371,139 376,142 376,148 371,151 366,148 366,142" fill="url(#screwGrad)"/>
<!-- Bottom Right -->
<polygon points="418,253 423,256 423,262 418,265 413,262 413,256" fill="url(#screwGrad)"/>
<!-- Bottom Right 2 -->
<polygon points="371,368 376,371 376,377 371,380 366,377 366,371" fill="url(#screwGrad)"/>
<!-- Bottom -->
<polygon points="256,415 261,418 261,424 256,427 251,424 251,418" fill="url(#screwGrad)"/>
<!-- Bottom Left -->
<polygon points="141,368 146,371 146,377 141,380 136,377 136,371" fill="url(#screwGrad)"/>
<!-- Left -->
<polygon points="94,253 99,256 99,262 94,265 89,262 89,256" fill="url(#screwGrad)"/>
<!-- Top Left -->
<polygon points="141,139 146,142 146,148 141,151 136,148 136,142" fill="url(#screwGrad)"/>
​<!-- Dual Lens Center Capsule / Recess -->
<!-- Recess Background Shadow -->
<path d="M 210 196 
A 60 60 0 0 1 302 196 
A 60 60 0 0 1 302 316 
A 60 60 0 0 1 210 316 
A 60 60 0 0 1 210 196 Z" 
fill="url(#lensMaskGrad)" opacity="0.6"/>
​<!-- Figure-8 Inner Groove Shadow -->
<path d="M 212,204 C 238,204 246,236 256,242 C 266,236 274,204 300,204 C 328,204 348,226 348,256 C 348,286 328,308 300,308 C 274,308 266,276 256,270 C 246,276 238,308 212,308 C 184,308 164,286 164,256 C 164,226 184,204 212,204 Z" 
fill="#0B4217" opacity="0.35"/>
​<!-- Dual Lenses -->
<!-- Left Lens -->
<circle cx="212" cy="256" r="34" fill="#1C2128"/>
<circle cx="212" cy="256" r="30" fill="#0E1217"/>
<circle cx="210" cy="254" r="28" fill="#181D24"/>
​<!-- Right Lens -->
<circle cx="300" cy="256" r="34" fill="#1C2128"/>
<circle cx="300" cy="256" r="30" fill="#0E1217"/>
<circle cx="298" cy="254" r="28" fill="#181D24"/>
​<!-- Small Inner Plate Screws (Top & Bottom of Green Center) -->
<circle cx="256" cy="160" r="4" fill="url(#screwGrad)"/>
<circle cx="256" cy="352" r="4" fill="url(#screwGrad)"/>
</g>
</svg>